name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */3 * *"  # 3日ごとに実行
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf "${{ vars.SUPABASE_URL }}/rest/v1/questions?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}"
          echo "Supabase pinged successfully"
